
<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>생성형 AI 강의 만족도 조사</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <h1>생성형 AI 강의 만족도 조사</h1>
        <form id="surveyForm">
            <label>이름</label>
            <input type="text" id="name" placeholder="이름을 입력하세요" required>
            
            <label>휴대폰 번호</label>
            <input type="tel" id="phone" placeholder="휴대폰 번호를 입력하세요" required>
            
            <label>이메일 주소</label>
            <input type="email" id="email" placeholder="이메일을 입력하세요" required>
            
            <label>1. 강의 내용은 유익했나요?</label>
            <select>
                <option>매우 그렇다</option>
                <option>그렇다</option>
                <option>보통이다</option>
                <option>아니다</option>
                <option>전혀 아니다</option>
            </select>
            
            <label>8. 추가로 남기고 싶은 의견이 있나요?</label>
            <textarea placeholder="의견을 입력해주세요"></textarea>
            
            <button type="button" id="thankYouButton">감사합니다</button>
            <div class="thank-you" id="thankYouMessage" style="display:none;">Thank You! Have a nice day!</div>
        </form>
    </div>
    <script src="script.js"></script>
</body>
</html>
