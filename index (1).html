<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PDF → PPT 변환 스튜디오</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="app">
        <header class="hero">
            <div>
                <p class="eyebrow">PDF를 PPT로 빠르게 변환</p>
                <h1>PDF → PPT 변환 스튜디오</h1>
                <p class="subtitle">
                    PDF를 업로드하면 OCR로 텍스트를 추출해 SVG 오버레이를 만들고,
                    편집한 결과를 16:9 PPT로 내보낼 수 있습니다.
                </p>
            </div>
            <div class="hero-actions">
                <label class="upload">
                    <input type="file" id="pdfInput" accept="application/pdf">
                    PDF 업로드
                </label>
                <button id="exportPpt" class="primary" disabled>16:9 PPT 내보내기</button>
            </div>
        </header>

        <main class="layout">
            <section class="panel">
                <h2>처리 단계</h2>
                <ol class="steps">
                    <li>PDF 페이지를 캔버스로 렌더링합니다.</li>
                    <li>OCR로 텍스트 요소를 추출해 SVG로 표시합니다.</li>
                    <li>편집한 내용으로 PPT 텍스트 박스를 생성합니다.</li>
                </ol>
                <div class="status" id="statusBox">
                    <span class="dot"></span>
                    <div>
                        <strong>대기 중</strong>
                        <p>PDF를 업로드하면 작업이 시작됩니다.</p>
                    </div>
                </div>
                <div class="page-list" id="pageList"></div>
            </section>

            <section class="workspace">
                <div class="workspace-header">
                    <h2>페이지 미리보기</h2>
                    <div class="controls">
                        <button id="runOcr" disabled>OCR 실행</button>
                        <button id="toggleOverlay" disabled>SVG 오버레이 보기</button>
                    </div>
                </div>
                <div class="preview" id="preview"></div>
            </section>

            <section class="panel">
                <h2>편집 가능한 텍스트</h2>
                <p class="help">OCR로 추출한 텍스트를 수정하면 SVG 및 PPT에 반영됩니다.</p>
                <div class="editor" id="editor"></div>
            </section>
        </main>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/4.4.168/pdf.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/pptxgenjs@3.12.0/dist/pptxgen.bundle.js"></script>
    <script src="script.js"></script>
</body>
</html>
